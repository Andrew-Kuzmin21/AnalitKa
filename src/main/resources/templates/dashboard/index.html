<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body {
            font-family: Arial;
            margin: 30px;
        }

        .kpi-container {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .kpi-card {
            border: 1px solid #ccc;
            padding: 20px;
            width: 220px;
            border-radius: 10px;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        canvas {
            max-width: 500px;
        }

    </style>

</head>
<body>

<h1>Dashboard</h1>

<div class="kpi-container">

    <div class="kpi-card">
        <h3>Total Customers</h3>
        <p th:text="${stats.totalCustomers}"></p>
    </div>

    <div class="kpi-card">
        <h3>Average Age</h3>
        <p th:text="${stats.averageAge}"></p>
    </div>

    <div class="kpi-card">
        <h3>Average Check</h3>
        <p th:text="${stats.averageCheck}"></p>
    </div>

    <div class="kpi-card">
        <h3>Male %</h3>
        <p th:text="${stats.malePercent}"></p>
    </div>

    <div class="kpi-card">
        <h3>Female %</h3>
        <p th:text="${stats.femalePercent}"></p>
    </div>

</div>

<div class="charts">

    <div>
        <h2>Customers By Region</h2>
        <canvas id="regionChart"></canvas>
    </div>

    <div>
        <h2>Age Groups</h2>
        <canvas id="ageChart"></canvas>
    </div>

    <div>
        <h2>RFM Segments</h2>
        <canvas id="rfmChart"></canvas>
    </div>

</div>

<script th:inline="javascript">

    const regions =
        [[${stats.customersByRegion}]];

    const ageGroups =
        [[${stats.customersByAgeGroup}]];

    const rfmSegments =
        [[${stats.rfmSegments}]];

    new Chart(
        document.getElementById('regionChart'),
        {
            type: 'bar',

            data: {

                labels: Object.keys(regions),

                datasets: [{
                    label: 'Customers',
                    data: Object.values(regions)
                }]
            }
        }
    );

    new Chart(
        document.getElementById('ageChart'),
        {
            type: 'pie',

            data: {

                labels: Object.keys(ageGroups),

                datasets: [{
                    data: Object.values(ageGroups)
                }]
            }
        }
    );

    new Chart(
        document.getElementById('rfmChart'),
        {
            type: 'doughnut',

            data: {

                labels: Object.keys(rfmSegments),

                datasets: [{
                    data: Object.values(rfmSegments)
                }]
            }
        }
    );

</script>

</body>
</html>
