<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }
        header {
            height: 70px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .layout {
            display: flex;
            height: calc(100vh - 70px);
        }
        .sidebar {
            width: 250px;
            background: white;
            border-right: 1px solid #ddd;
            padding: 20px;
            overflow-y: auto;
        }
        .sidebar h2 {
            margin-bottom: 20px;
        }
        .dashboard-link {
            display: block;
            padding: 12px;
            margin-bottom: 10px;
            background: #f4f6f9;
            border-radius: 8px;
            text-decoration: none;
            color: black;
        }
        .dashboard-link:hover {
            background: #e4e7eb;
        }
        main {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }
        .kpi-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .kpi-card h3 {
            margin-bottom: 10px;
            color: #555;
        }
        .kpi-card p {
            font-size: 28px;
            font-weight: bold;
        }
        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 25px;
        }
        .chart-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .chart-card h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }
        canvas {
            width: 100% !important;
            height: 300px !important;
        }
        button {
            cursor: pointer;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
        }
        .primary-btn {
            background: #2563eb;
            color: white;
        }
        .logout-btn {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <form th:action="@{/customers/import}"
              method="post"
              enctype="multipart/form-data">
            <input type="file" name="file" required>
            <button type="submit" class="primary-btn">
                Import CSV
            </button>
        </form>
        <a th:href="@{/dashboards/create}">
            <button class="primary-btn">
                Create dashboard
            </button>
        </a>
    </div>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-btn">
            Logout
        </button>
    </form>
</header>

<div class="layout">
    <aside class="sidebar">
        <h2>Dashboards</h2>
        <div th:each="dashboard : ${dashboards}"
             style="margin-bottom:15px;">

            <a class="dashboard-link"
               th:href="@{'/dashboards/' + ${dashboard.id}}"
               th:text="${dashboard.name}">
            </a>

            <div style="
        display:flex;
        gap:8px;
        margin-top:5px;
    ">

                <a th:href="@{'/dashboards/' + ${dashboard.id} + '/edit'}">
                    <button style="
                background:#f59e0b;
                color:white;
            ">
                        Edit
                    </button>
                </a>

                <form th:action="@{'/dashboards/' + ${dashboard.id} + '/delete'}"
                      method="post"
                      onsubmit="return confirm('Delete dashboard?');">

                    <button type="submit"
                            style="
                        background:#ef4444;
                        color:white;
                    ">
                        Delete
                    </button>

                </form>

            </div>

        </div>
    </aside>

    <main>
        <h1 style="margin-bottom: 25px;">
            Customer Analytics Dashboard
        </h1>
        <div class="kpi-container">
            <div class="kpi-card">
                <h3>Total Customers</h3>
                <p th:text="${stats.totalCustomers}"></p>
            </div>
            <div class="kpi-card">
                <h3>Average Age</h3>
                <p th:text="${stats.averageAge}"></p>
            </div>
            <div class="kpi-card">
                <h3>Average Check</h3>
                <p th:text="${stats.averageCheck}"></p>
            </div>
            <div class="kpi-card">
                <h3>Male %</h3>
                <p th:text="${stats.malePercent}"></p>
            </div>
            <div class="kpi-card">
                <h3>Female %</h3>
                <p th:text="${stats.femalePercent}"></p>
            </div>
        </div>
        <div class="charts">
            <div class="chart-card">
                <h2>Customers By Region</h2>
                <canvas id="regionChart"></canvas>
            </div>
            <div class="chart-card">
                <h2>Age Groups</h2>
                <canvas id="ageChart"></canvas>
            </div>
            <div class="chart-card">
                <h2>RFM Segments</h2>
                <canvas id="rfmChart"></canvas>
            </div>
            <div class="chart-card">
                <h2>ABC Analysis</h2>
                <canvas id="abcChart"></canvas>
            </div>
            <div class="chart-card">
                <h2>XYZ Analysis</h2>
                <canvas id="xyzChart"></canvas>
            </div>
            <div class="chart-card">
                <h2>ABC/XYZ Matrix</h2>
                <canvas id="matrixChart"></canvas>
            </div>
        </div>
    </main>
</div>

<script th:inline="javascript">
    const regions = [[${stats.customersByRegion}]];
    const ageGroups = [[${stats.customersByAgeGroup}]];
    const rfmSegments = [[${stats.rfmSegments}]];
    const abcCategories = [[${stats.abcCategories}]];
    const xyzCategories = [[${stats.xyzCategories}]];
    const matrixGroups = [[${stats.abcXyzGroups}]];
    new Chart(document.getElementById('regionChart'), {
        type: 'bar',
        data: {
            labels: Object.keys(regions),
            datasets: [{
                label: 'Customers',
                data: Object.values(regions)
            }]
        }
    });
    new Chart(document.getElementById('ageChart'), {
        type: 'pie',
        data: {
            labels: Object.keys(ageGroups),
            datasets: [{
                data: Object.values(ageGroups)
            }]
        }
    });
    new Chart(document.getElementById('rfmChart'), {
        type: 'doughnut',
        data: {
            labels: Object.keys(rfmSegments),
            datasets: [{
                data: Object.values(rfmSegments)
            }]
        }
    });
    new Chart(document.getElementById('abcChart'), {
        type: 'pie',
        data: {
            labels: Object.keys(abcCategories),
            datasets: [{
                data: Object.values(abcCategories)
            }]
        }
    });
    new Chart(document.getElementById('xyzChart'), {
        type: 'pie',
        data: {
            labels: Object.keys(xyzCategories),
            datasets: [{
                data: Object.values(xyzCategories)
            }]
        }
    });
    new Chart(document.getElementById('matrixChart'), {
        type: 'bar',
        data: {
            labels: Object.keys(matrixGroups),
            datasets: [{
                label: 'Customers',
                data: Object.values(matrixGroups)
            }]
        }
    });
</script>
</body>
</html>
