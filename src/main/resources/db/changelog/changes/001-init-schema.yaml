  databaseChangeLog:

    # =========================
    # SEQUENCES
    # =========================

    - changeSet:
        id: 001-create-sequences
        author: kuzmin

        changes:

          - createSequence:
              sequenceName: user_id_seq
              startValue: 1

          - createSequence:
              sequenceName: customer_id_seq
              startValue: 1

          - createSequence:
              sequenceName: segment_id_seq
              startValue: 1

          - createSequence:
              sequenceName: dashboard_id_seq
              startValue: 1

          - createSequence:
              sequenceName: dashboard_settings_id_seq
              startValue: 1

          - createSequence:
              sequenceName: chart_id_seq
              startValue: 1

    # =========================
    # USERS
    # =========================

    - changeSet:
        id: 002-create-users
        author: kuzmin

        changes:

          - createTable:
              tableName: users

              columns:

                - column:
                    name: id
                    type: BIGINT
                    defaultValueSequenceNext: user_id_seq
                    constraints:
                      primaryKey: true
                      nullable: false

                - column:
                    name: user_email
                    type: VARCHAR(50)
                    constraints:
                      nullable: false
                      unique: true

                - column:
                    name: user_password
                    type: VARCHAR(100)
                    constraints:
                      nullable: false

                - column:
                    name: user_last_imported_file_name
                    type: VARCHAR(100)


    # =========================
    # CUSTOMERS
    # =========================

    - changeSet:
        id: 003-create-customers
        author: kuzmin

        changes:

          - createTable:
              tableName: customers

              columns:

                - column:
                    name: id
                    type: BIGINT
                    defaultValueSequenceNext: customer_id_seq
                    constraints:
                      primaryKey: true
                      nullable: false

                - column:
                    name: customer_age
                    type: INTEGER

                - column:
                    name: customer_sex
                    type: VARCHAR(20)
                    constraints:
                      nullable: false

                - column:
                    name: customer_region
                    type: VARCHAR(255)
                    constraints:
                      nullable: false

                - column:
                    name: customer_date_of_registration
                    type: DATE
                    constraints:
                      nullable: false

                - column:
                    name: customer_count_of_orders
                    type: INTEGER
                    constraints:
                      nullable: false

                - column:
                    name: customer_average_check
                    type: DECIMAL(19,2)
                    constraints:
                      nullable: false

                - column:
                    name: customer_total_spends
                    type: DECIMAL(19,2)
                    constraints:
                      nullable: false

                - column:
                    name: customer_last_order_date
                    type: DATE

                - column:
                    name: user_id
                    type: BIGINT
                    constraints:
                      nullable: false

          - addForeignKeyConstraint:
              baseTableName: customers
              baseColumnNames: user_id
              referencedTableName: users
              referencedColumnNames: id
              constraintName: fk_customers_user


    # =========================
    # SEGMENTS
    # =========================

    - changeSet:
        id: 004-create-segments
        author: kuzmin

        changes:

          - createTable:
              tableName: segments

              columns:

                - column:
                    name: id
                    type: BIGINT
                    defaultValueSequenceNext: segment_id_seq
                    constraints:
                      primaryKey: true
                      nullable: false

                - column:
                    name: segment_age_from
                    type: INTEGER

                - column:
                    name: segment_age_to
                    type: INTEGER

                - column:
                    name: segment_sex
                    type: TEXT

                - column:
                    name: segment_region
                    type: TEXT

                - column:
                    name: segment_date_of_registration_from
                    type: DATE

                - column:
                    name: segment_date_of_registration_to
                    type: DATE

                - column:
                    name: segment_count_of_orders_from
                    type: INTEGER

                - column:
                    name: segment_count_of_orders_to
                    type: INTEGER

                - column:
                    name: segment_average_check_from
                    type: DOUBLE

                - column:
                    name: segment_average_check_to
                    type: DOUBLE

                - column:
                    name: segment_total_spends_from
                    type: DOUBLE

                - column:
                    name: segment_total_spends_to
                    type: DOUBLE

                - column:
                    name: segment_last_order_date_from
                    type: DATE

                - column:
                    name: segment_last_order_date_to
                    type: DATE

                - column:
                    name: segment_creation_date
                    type: TIMESTAMP
                    constraints:
                      nullable: false

                - column:
                    name: user_id
                    type: BIGINT
                    constraints:
                      nullable: false

          - addForeignKeyConstraint:
              baseTableName: segments
              baseColumnNames: user_id
              referencedTableName: users
              referencedColumnNames: id
              constraintName: fk_segments_user

    # =========================
    # DASHBOARDS
    # =========================

    - changeSet:
        id: 005-create-dashboards
        author: kuzmin

        changes:

          - createTable:
              tableName: dashboards

              columns:

                - column:
                    name: id
                    type: BIGINT
                    defaultValueSequenceNext: dashboard_id_seq
                    constraints:
                      primaryKey: true
                      nullable: false

                - column:
                    name: dashboard_name
                    type: VARCHAR(255)
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_description
                    type: TEXT

                - column:
                    name: user_id
                    type: BIGINT
                    constraints:
                      nullable: false

                - column:
                    name: segment_id
                    type: BIGINT

                - column:
                    name: is_default
                    type: BOOLEAN
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_creation_date
                    type: TIMESTAMP
                    constraints:
                      nullable: false

          - addForeignKeyConstraint:
              baseTableName: dashboards
              baseColumnNames: user_id
              referencedTableName: users
              referencedColumnNames: id
              constraintName: fk_dashboards_user

          - addForeignKeyConstraint:
              baseTableName: dashboards
              baseColumnNames: segment_id
              referencedTableName: segments
              referencedColumnNames: id
              constraintName: fk_dashboards_segment

    # =========================
    # DASHBOARDS SETTINGS
    # =========================

    - changeSet:
        id: 005-create-dashboards-settings
        author: kuzmin

        changes:

          - createTable:
              tableName: dashboard_settings

              columns:

                - column:
                    name: id
                    type: BIGINT
                    defaultValueSequenceNext: dashboard_settings_id_seq
                    constraints:
                      primaryKey: true
                      nullable: false

                - column:
                    name: dashboard_id
                    type: BIGINT
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_abc_category_a_border
                    type: DOUBLE
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_abc_category_b_border
                    type: DOUBLE
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_xyz_category_x_border
                    type: DOUBLE
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_xyz_category_y_border
                    type: DOUBLE
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_recency5
                    type: INTEGER
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_recency4
                    type: INTEGER
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_recency3
                    type: INTEGER
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_recency2
                    type: INTEGER
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_frequency2
                    type: INTEGER
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_frequency3
                    type: INTEGER
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_frequency4
                    type: INTEGER
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_frequency5
                    type: INTEGER
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_monetary2
                    type: DOUBLE
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_monetary3
                    type: DOUBLE
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_monetary4
                    type: DOUBLE
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_settings_monetary5
                    type: DOUBLE
                    constraints:
                      nullable: false

          - addForeignKeyConstraint:
              baseTableName: dashboard_settings
              baseColumnNames: dashboard_id
              referencedTableName: dashboards
              referencedColumnNames: id
              constraintName: fk_dashboards_setting_dashboard


    # =========================
    # CHARTS
    # =========================

    - changeSet:
        id: 006-create-charts
        author: kuzmin

        changes:

          - createTable:
              tableName: charts

              columns:

                - column:
                    name: id
                    type: BIGINT
                    defaultValueSequenceNext: chart_id_seq
                    constraints:
                      primaryKey: true
                      nullable: false

                - column:
                    name: chart_name
                    type: VARCHAR(100)
                    constraints:
                      nullable: false

                - column:
                    name: dashboard_id
                    type: BIGINT
                    constraints:
                      nullable: false

                - column:
                    name: chart_type
                    type: VARCHAR(50)
                    constraints:
                      nullable: false

                - column:
                    name: chart_axis_x
                    type: VARCHAR(255)
                    constraints:
                      nullable: false

                - column:
                    name: chart_axis_y
                    type: VARCHAR(255)

                - column:
                    name: chart_aggregation_type
                    type: VARCHAR(50)

                - column:
                    name: chart_position_x
                    type: INTEGER

                - column:
                    name: chart_position_y
                    type: INTEGER

                - column:
                    name: chart_width
                    type: INTEGER

                - column:
                    name: chart_height
                    type: INTEGER

          - addForeignKeyConstraint:
              baseTableName: charts
              baseColumnNames: dashboard_id
              referencedTableName: dashboards
              referencedColumnNames: id
              constraintName: fk_charts_dashboard